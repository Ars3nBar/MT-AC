name: MT-AC
version: '1.0.0'
main: ru.mirtime.ac.MirTimeAC
api-version: '1.21'
softdepend:
  - MirTimePunish
commands:
  mtac:
    description: Управление античитом MT-AC
    permission: mtac.admin
permissions:
  mtac.bypass:
    description: Обход проверок античита
    default: op
  mtac.alerts:
    description: Получение алертов античита в чат
    default: op
  mtac.admin:
    description: Команды управления античитом
    default: op
    
